<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090f18">
  <title>Julekalender til Adriana 🎄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8cc80;
      --cream: #f0e2c8;
      --green-dark: #122b1e;
      --green-mid: #1c3d2a;
      --bg: #090f18;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- background ---- */
    #stars-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    #snow-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .flake {
      position: absolute;
      top: -2em;
      color: #fff;
      animation: snowfall linear infinite;
      user-select: none;
    }

    @keyframes snowfall {
      to { transform: translateY(105vh) rotate(360deg); }
    }

    /* ---- layout ---- */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 56px 24px 80px;
    }

    /* ---- header ---- */
    .header {
      text-align: center;
      margin-bottom: 64px;
    }

    .header .candles {
      font-size: 1.6em;
      letter-spacing: 8px;
      margin-bottom: 20px;
      display: block;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-style: italic;
      font-size: clamp(2em, 6vw, 3.2em);
      color: var(--gold-light);
      text-shadow: 0 0 30px rgba(201, 168, 76, 0.4);
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .header .subtitle {
      font-size: 0.85em;
      letter-spacing: 1.5px;
      color: var(--cream);
      opacity: 0.5;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px auto 0;
      max-width: 280px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(201, 168, 76, 0.4), transparent);
    }

    .divider span { color: var(--gold); font-size: 0.9em; }

    /* ---- calendar grid ---- */
    .calendar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 48px;
      width: 100%;
      max-width: 600px;
    }

    @media (max-width: 360px) {
      .calendar { grid-template-columns: 1fr; max-width: 260px; }
    }

    /* ---- door wrapper ---- */
    .door-wrap {
      perspective: 500px;
      position: relative;
    }

    /* warm candlelight glow */
    .door-glow {
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      background: radial-gradient(ellipse at center,
        rgba(255, 170, 50, 0.4) 0%,
        rgba(255, 100, 20, 0.12) 55%,
        transparent 75%);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .door-wrap.glowing .door-glow { opacity: 1; }

    /* ---- door panel ---- */
    .door {
      position: relative;
      z-index: 1;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      border: 1.5px solid rgba(201, 168, 76, 0.5);
      background: linear-gradient(145deg, var(--green-mid), var(--green-dark));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;

      /* pivot on left edge — door swings open to the right */
      transform-origin: left center;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .door:not(.opening):not(.opened):hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 18px rgba(201, 168, 76, 0.18);
      border-color: rgba(201, 168, 76, 0.75);
    }

    /* corner ornaments */
    .door::before,
    .door::after {
      content: '✦';
      position: absolute;
      font-size: 0.55em;
      color: var(--gold);
      opacity: 0.35;
      pointer-events: none;
    }
    .door::before { top: 10px; left: 12px; }
    .door::after  { bottom: 10px; right: 12px; }

    /* door swings open from left hinge, holds, swings back flat */
    @keyframes door-toward {
      0%   {
        transform: rotateY(0deg);
        animation-timing-function: cubic-bezier(0.4, 0, 0.3, 1);
      }
      40%  {
        transform: rotateY(-82deg);
        animation-timing-function: linear;
      }
      65%  {
        transform: rotateY(-82deg);
        animation-timing-function: cubic-bezier(0.5, 0, 0.6, 1);
      }
      100% { transform: rotateY(0deg); }
    }

    .door.opening {
      animation: door-toward 3.5s forwards;
      cursor: default;
      pointer-events: none;
    }

    /* flat opened state — no transform, just colour change */
    .door.opened {
      border-color: rgba(201, 168, 76, 0.7);
      background: linear-gradient(145deg, #223b2e, #162a1e);
    }

    .door.opened:hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 18px rgba(201, 168, 76, 0.18);
    }

    /* ---- door content ---- */
    .door-holly {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1em;
      pointer-events: none;
    }

    .door-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4em, 4vw, 1.9em);
      font-weight: 600;
      color: var(--gold-light);
      line-height: 1;
      text-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
      letter-spacing: 1px;
    }

    .door-icon  { font-size: 1.8em; }

    .door-label {
      font-size: 0.65em;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.6;
    }

    /* ---- modal ---- */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 18, 0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      padding: 24px;
    }

    .overlay.show { display: flex; }

    .modal {
      position: relative;
      background: linear-gradient(150deg, var(--green-mid) 0%, var(--green-dark) 100%);
      border: 1.5px solid rgba(201, 168, 76, 0.5);
      border-radius: 20px;
      padding: 50px 44px 44px;
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(201, 168, 76, 0.07);
      animation: modal-enter 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modal-enter {
      from { opacity: 0; transform: scale(0.04); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-close {
      position: absolute;
      top: 16px; right: 20px;
      background: none;
      border: none;
      color: var(--cream);
      font-size: 1.6em;
      cursor: pointer;
      opacity: 0.35;
      line-height: 1;
      transition: opacity 0.2s;
    }
    .modal-close:hover { opacity: 0.85; }

    .modal-top-icon {
      text-align: center;
      font-size: 2.4em;
      margin-bottom: 10px;
    }

    .modal-label {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.5em;
      color: var(--gold-light);
      margin-bottom: 28px;
    }

    .modal-body {
      font-size: 1em;
      line-height: 1.85;
      color: var(--cream);
      font-weight: 300;
    }

    .modal-body p + p { margin-top: 1em; }

    .modal-footer-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0 0;
    }
    .modal-footer-divider::before,
    .modal-footer-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(201, 168, 76, 0.2);
    }
    .modal-footer-divider span { font-size: 0.8em; color: var(--gold); opacity: 0.5; }

    .modal::-webkit-scrollbar { width: 4px; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    .modal::-webkit-scrollbar-thumb { background: rgba(201, 168, 76, 0.2); border-radius: 4px; }

    /* ---- spin the wheel ---- */
    .wheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .wheel-pointer-wrap {
      position: relative;
    }

    .wheel-pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.7em;
      color: var(--gold);
      filter: drop-shadow(0 2px 6px rgba(201,168,76,0.6));
      z-index: 2;
      line-height: 1;
    }

    #wheel-canvas {
      border-radius: 50%;
      display: block;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
    }

    .spin-btn {
      background: linear-gradient(135deg, var(--gold), #9a7820);
      color: var(--green-dark);
      border: none;
      border-radius: 50px;
      padding: 11px 34px;
      font-family: 'Lato', sans-serif;
      font-size: 1em;
      font-weight: 400;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(201, 168, 76, 0.45);
    }

    .spin-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    .wheel-result {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.15em;
      color: var(--gold-light);
      text-align: center;
      min-height: 1.6em;
      animation: result-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes result-pop {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ===================== MOBILE ===================== */
    @media (max-width: 600px) {

      .page {
        padding: 40px 16px 60px;
        padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      }

      .header {
        margin-bottom: 40px;
      }

      .header .candles {
        font-size: 1.25em;
        letter-spacing: 5px;
        margin-bottom: 12px;
      }

      .header h1 {
        font-size: clamp(1.9em, 10vw, 2.8em);
        margin-bottom: 10px;
      }

      .divider { margin-top: 16px; }

      .calendar {
        gap: 24px;
        max-width: 100%;
      }

      /* doors — keep 2 col, slightly smaller ornament text */
      .door-holly { font-size: 0.85em; }
      .door-label { font-size: 0.6em; letter-spacing: 2px; }
      .door-icon  { font-size: 1.5em; }

      /* ---- bottom-sheet modal ---- */
      .overlay {
        align-items: flex-end;
        padding: 0;
        backdrop-filter: blur(8px);
      }

      .modal {
        border-radius: 24px 24px 0 0;
        padding: 28px 22px calc(28px + env(safe-area-inset-bottom, 12px));
        max-height: 92vh;
        max-height: 92dvh;
        max-width: 100%;
        animation: modal-slide-up 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        -webkit-overflow-scrolling: touch;
      }

      /* drag handle */
      .modal::before {
        content: '';
        display: block;
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: rgba(201, 168, 76, 0.3);
        margin: 0 auto 20px;
      }

      .modal-close {
        top: 20px;
        right: 18px;
        font-size: 1.8em;
        opacity: 0.4;
        padding: 4px 8px;
      }

      .modal-top-icon { font-size: 2em; margin-bottom: 6px; }
      .modal-label    { font-size: 1.3em; margin-bottom: 20px; }
      .modal-body     { font-size: 0.95em; }

      /* ---- spin button — bigger tap target ---- */
      .spin-btn {
        padding: 14px 36px;
        font-size: 1.05em;
      }

      .wheel-wrap { gap: 18px; }
    }

    @keyframes modal-slide-up {
      from { transform: translateY(100%); opacity: 0.6; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ================================================== */

    /* ---- luke 4 avsløring ---- */
    .surprise-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    .surprise-icon {
      font-size: 3.6em;
      animation: surprise-bounce 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes surprise-bounce {
      from { opacity: 0; transform: scale(0.4) translateY(20px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }

    .surprise-heading {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.55em;
      color: var(--gold-light);
      line-height: 1.2;
    }

    .surprise-desc {
      font-size: 1em;
      line-height: 1.8;
      color: var(--cream);
      font-weight: 300;
    }

    .surprise-divider {
      width: 60px;
      height: 1px;
      background: rgba(201, 168, 76, 0.3);
    }

    .surprise-countdown-label {
      font-size: 0.72em;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.5;
    }

    .surprise-countdown {
      font-family: 'Playfair Display', serif;
      font-size: 2em;
      color: var(--gold-light);
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(201, 168, 76, 0.35);
    }

    .surprise-date-label {
      font-size: 0.78em;
      color: var(--cream);
      opacity: 0.4;
      letter-spacing: 1px;
    }

    /* ---- lock screen ---- */
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lock-screen.unlocking {
      animation: lock-out 0.55s ease forwards;
      pointer-events: none;
    }

    @keyframes lock-out {
      to { opacity: 0; transform: scale(1.04); }
    }

    .lock-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: lock-in 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes lock-in {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lock-holly {
      font-size: 1.5em;
      letter-spacing: 10px;
    }

    .lock-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-style: italic;
      font-size: clamp(1.8em, 6vw, 2.4em);
      color: var(--gold-light);
      text-shadow: 0 0 30px rgba(201, 168, 76, 0.4);
      text-align: center;
    }

    .lock-sub {
      font-size: 0.75em;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.4;
      margin-top: -20px;
    }

    .lock-dots {
      display: flex;
      gap: 20px;
    }

    .lock-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid rgba(201, 168, 76, 0.4);
      background: transparent;
      transition: background 0.14s, border-color 0.14s, transform 0.14s;
    }

    .lock-dot.filled {
      background: var(--gold);
      border-color: var(--gold);
      transform: scale(1.2);
    }

    .lock-dots.wrong .lock-dot.filled {
      background: #c0392b;
      border-color: #e74c3c;
    }

    @keyframes lock-shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-11px); }
      40%       { transform: translateX(11px); }
      60%       { transform: translateX(-8px); }
      80%       { transform: translateX(5px); }
    }

    .lock-dots.wrong { animation: lock-shake 0.5s ease; }

    .lock-pad {
      display: grid;
      grid-template-columns: repeat(3, 76px);
      grid-template-rows: repeat(4, 76px);
      gap: 12px;
    }

    .lock-key {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1.5px solid rgba(201, 168, 76, 0.18);
      background: rgba(255, 255, 255, 0.05);
      color: var(--cream);
      font-family: 'Lato', sans-serif;
      font-size: 1.55em;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.1s, transform 0.09s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .lock-key:active,
    .lock-key.pressed {
      background: rgba(201, 168, 76, 0.18);
      transform: scale(0.91);
    }

    .lock-key--empty {
      background: transparent !important;
      border-color: transparent !important;
      pointer-events: none;
    }

    .lock-key--del {
      font-size: 1.15em;
      opacity: 0.55;
    }

    @media (max-width: 400px) {
      .lock-pad {
        grid-template-columns: repeat(3, 68px);
        grid-template-rows: repeat(4, 68px);
        gap: 10px;
      }
      .lock-key { width: 68px; height: 68px; font-size: 1.35em; }
    }
  </style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-inner">
    <div class="lock-holly">🕯️ 🌿 🕯️</div>
    <h2 class="lock-title">Til Adriana</h2>
    <p class="lock-sub">Skriv inn koden</p>
    <div class="lock-dots">
      <div class="lock-dot"></div>
      <div class="lock-dot"></div>
      <div class="lock-dot"></div>
      <div class="lock-dot"></div>
      <div class="lock-dot"></div>
      <div class="lock-dot"></div>
    </div>
    <div class="lock-pad">
      <button class="lock-key" data-k="1">1</button>
      <button class="lock-key" data-k="2">2</button>
      <button class="lock-key" data-k="3">3</button>
      <button class="lock-key" data-k="4">4</button>
      <button class="lock-key" data-k="5">5</button>
      <button class="lock-key" data-k="6">6</button>
      <button class="lock-key" data-k="7">7</button>
      <button class="lock-key" data-k="8">8</button>
      <button class="lock-key" data-k="9">9</button>
      <div class="lock-key lock-key--empty"></div>
      <button class="lock-key" data-k="0">0</button>
      <button class="lock-key lock-key--del" id="lock-del">⌫</button>
    </div>
  </div>
</div>

<canvas id="stars-canvas"></canvas>
<div id="snow-layer"></div>

<div class="page">
  <header class="header">
    <span class="candles">🕯️ 🕯️ 🕯️ 🕯️</span>
    <h1>Til Adriana</h1>
    <p class="subtitle">En liten kalender fra meg — gjerne åpne lukene med meg tihi</p>
    <div class="divider"><span>🌿</span></div>
  </header>

  <div class="calendar" id="calendar"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">×</button>
    <div class="modal-top-icon" id="modal-icon"></div>
    <div class="modal-label"   id="modal-label"></div>
    <div class="modal-body"    id="modal-body"></div>
    <div class="modal-footer-divider"><span>✦</span></div>
  </div>
</div>

<script>
// =====================================================
//  PASSCODE LOCK
// =====================================================
(function () {
  const ENC = 'MTUwMjI1'; // btoa('150225') — PIN ikke i klartekst
  const SK  = 'adriana_26_s';
  let pin  = '';
  let busy = false;

  const lock = document.getElementById('lock-screen');
  const dots = document.querySelectorAll('.lock-dot');
  const wrap = document.querySelector('.lock-dots');

  if (sessionStorage.getItem(SK) === btoa('ok')) { lock.remove(); return; }

  function paint() {
    dots.forEach((d, i) => d.classList.toggle('filled', i < pin.length));
  }

  function unlock() {
    busy = true;
    sessionStorage.setItem(SK, btoa('ok'));
    lock.classList.add('unlocking');
    setTimeout(() => lock.remove(), 580);
  }

  function reject() {
    busy = true;
    wrap.classList.add('wrong');
    setTimeout(() => {
      wrap.classList.remove('wrong');
      pin  = '';
      busy = false;
      paint();
    }, 650);
  }

  function check() {
    if (btoa(pin) === ENC) unlock(); else reject();
  }

  function press(k) {
    if (busy || pin.length >= 6) return;
    pin += k;
    paint();
    if (pin.length === 6) setTimeout(check, 90);
  }

  function del() {
    if (busy) return;
    pin = pin.slice(0, -1);
    paint();
  }

  document.querySelectorAll('.lock-key[data-k]').forEach(btn => {
    btn.addEventListener('click', () => press(btn.dataset.k));
  });
  document.getElementById('lock-del').addEventListener('click', del);

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lock-screen')) return;
    if (e.key >= '0' && e.key <= '9') press(e.key);
    if (e.key === 'Backspace') del();
  });
})();

// =====================================================
//  ADVENTSDATOER  (1.–4. advent 2026, kl. 15:00)
// =====================================================
const ADVENT = [
  new Date('2026-11-29T15:00:00'), // 1. advent
  new Date('2026-12-06T15:00:00'), // 2. advent
  new Date('2026-12-13T15:00:00'), // 3. advent
  new Date('2026-12-20T15:00:00'), // 4. advent
];

const ICONS  = ['🕯️', '⭐', '🎁', '🎄'];
const ROMAN  = ['Luke 1', 'Luke 2', 'Luke 3', 'Luke 4'];
const LABELS = ['1. advent', '2. advent', '3. advent', '4. advent'];

// =====================================================
//  INNHOLD I LUKENE
// =====================================================
const CONTENT = [
  '', '', '', // luke 1–3 bruker hjul
  /* Luke 4 */
  `<div style="text-align:center;padding:16px 0 8px">
    <div style="font-size:3em;margin-bottom:20px;animation:surprise-bounce 0.9s cubic-bezier(0.34,1.56,0.64,1) both">🎁</div>
    <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:1.7em;color:var(--gold-light);line-height:1.3">
      Jeg har en liten<br>gave til deg
    </div>
    <div style="margin-top:16px;font-size:1.5em">:))</div>
  </div>`,
];

const STORAGE_KEY = 'adriana_advent_26';
const openedSet   = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
const animating   = new Set();

const WAIT_MSGS = [
  'Du må vente litt til kjære deg — tihi 🙈',
  'Neeei, ikke enda! Kom tilbake snart 🎄',
  'Litt tålmodighet, min vakre! 🕯️',
  'Hmm, prøver du å jukse? 😄',
  'Snart, snart... men ikke enda! ✨',
];
let waitMsgIndex = 0;
let waitCountdownTimer = null;
let surpriseTimer = null;

function renderSurprise() {
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div class="surprise-wrap">
      <div class="surprise-icon">${SURPRISE.icon}</div>
      <div class="surprise-heading">${SURPRISE.heading}</div>
      <div class="surprise-desc">${SURPRISE.desc}</div>
      <div class="surprise-divider"></div>
      <div class="surprise-countdown-label">om</div>
      <div class="surprise-countdown" id="surprise-countdown"></div>
      <div class="surprise-date-label">${SURPRISE.dateLabel}</div>
    </div>
  `;
  function tick() {
    const diff = SURPRISE.date - Date.now();
    const el = document.getElementById('surprise-countdown');
    if (!el) return;
    if (diff <= 0) { el.textContent = 'nå! 🎉'; return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = d > 0 ? `${d}d ${h}t ${m}m ${s}s` : `${h}t ${m}m ${s}s`;
  }
  tick();
  surpriseTimer = setInterval(tick, 1000);
}

function saveOpened() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...openedSet]));
}

function isUnlocked(i) {
  return Date.now() >= ADVENT[i].getTime();
}

function countdownText(i) {
  const diff = ADVENT[i].getTime() - Date.now();
  if (diff <= 0) return null;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  if (d > 1)   return `${d} dager, ${h}t ${m}m ${s}s`;
  if (d === 1) return `1 dag, ${h}t ${m}m ${s}s`;
  if (h > 0)   return `${h}t ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

// =====================================================
//  SPIN THE WHEEL  (luke 1)
// =====================================================
const WHEELS = [
  /* luke 1 */
  [
    { lines: ['Middag ute', 'ila uka'],      bg: '#1a3d2b', fg: '#e8cc80' },
    { lines: ['Filmkveld', '(hjemme/kino)'], bg: '#7a1818', fg: '#f0d8c8' },
    { lines: ['Lego-date'],                  bg: '#b08020', fg: '#0d1f14' },
    { lines: ['Du bestemmer', 'hva vi gjør ikveld'], bg: '#1e4a30', fg: '#e8cc80' },
  ],
  /* luke 2 */
  [
    { lines: ['Du bestemmer', 'en hel dag'], bg: '#2a1a40', fg: '#e0d4ff' },
    { lines: ['JA til 3 ting', 'innen 2 dager'], bg: '#7a1818', fg: '#f0d8c8' },
    { lines: ['Date-kort', 'jeg betaler alt'], bg: '#7a5200', fg: '#fff0c0' },
    { lines: ['Hemmelig', 'date 🤫'],          bg: '#1a3d2b', fg: '#c8f5e0' },
  ],
  /* luke 3 */
  [
    { lines: ['Pepperkake-', 'baking 🍪'],  bg: '#5c2800', fg: '#ffe8c8' },
    { lines: ['Julegløgg-', 'tur ☕'],      bg: '#1a3d2b', fg: '#c8f5e0' },
    { lines: ['Julemarked', '🎄'],          bg: '#7a1818', fg: '#f0d8c8' },
    { lines: ['Julefilm-', 'kveld 🎬'],     bg: '#1a1a40', fg: '#d8d8ff' },
  ],
];

let currentWheelDoor = 0;
let wheelRot = 0;
let wheelSpinning = false;
let wheelAF = null;

function wheelResultKey(i) { return `adriana_wheel_result_26_door${i}`; }

function renderWheel(doorIndex) {
  currentWheelDoor = doorIndex;
  if (!localStorage.getItem(wheelResultKey(doorIndex))) wheelRot = 0;
  const body   = document.getElementById('modal-body');
  const saved  = localStorage.getItem(wheelResultKey(doorIndex));

  body.innerHTML = `
    <div class="wheel-wrap">
      <div class="wheel-pointer-wrap">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheel-canvas" width="290" height="290"></canvas>
      </div>
      ${saved
        ? `<div style="font-size:0.8em;opacity:0.45;letter-spacing:1px">Svaret er låst 🔒</div>`
        : `<button class="spin-btn" id="spin-btn">🎰 Spin!</button>`}
      <div class="wheel-result" id="wheel-result" style="opacity:${saved ? 1 : 0}"></div>
    </div>
  `;

  if (saved) {
    const { seg, rot } = JSON.parse(saved);
    wheelRot = rot;
    drawWheel(rot);
    document.getElementById('wheel-result').textContent = WHEELS[doorIndex][seg].lines.join(' ') + ' 🎉';
  } else {
    document.getElementById('spin-btn').addEventListener('click', spinWheel);
    drawWheel(wheelRot);
  }
}

function drawWheel(rot) {
  const canvas = document.getElementById('wheel-canvas');
  if (!canvas) return;
  const dpr  = window.devicePixelRatio || 1;
  const SIZE = Math.min(290, window.innerWidth - 80);
  canvas.width        = SIZE * dpr;
  canvas.height       = SIZE * dpr;
  canvas.style.width  = SIZE + 'px';
  canvas.style.height = SIZE + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = SIZE / 2, cy = SIZE / 2, r = SIZE / 2 - 7;
  const segs = WHEELS[currentWheelDoor];
  const seg = Math.PI * 2 / segs.length;

  ctx.clearRect(0, 0, SIZE, SIZE);
  const fontSize = Math.max(11, Math.round(SIZE * 0.048));

  segs.forEach((s, i) => {
    const start    = rot - Math.PI / 2 + i * seg;
    const end      = start + seg;
    const bisector = start + seg / 2;

    // segment
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = s.bg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(201,168,76,0.5)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // horizontal text centered in the segment — always readable
    const tx = cx + Math.cos(bisector) * r * 0.63;
    const ty = cy + Math.sin(bisector) * r * 0.63;
    const lh = 18;
    const totalH = (s.lines.length - 1) * lh;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = s.fg;
    ctx.shadowColor = 'rgba(0,0,0,0.75)';
    ctx.shadowBlur = 6;
    ctx.font = `bold ${fontSize}px Lato, sans-serif`;
    s.lines.forEach((line, j) => {
      ctx.fillText(line, tx, ty - totalH / 2 + j * lh);
    });
    ctx.shadowBlur = 0;
    ctx.restore();
  });

  // outer rim
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(201,168,76,0.7)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // hub
  ctx.beginPath();
  ctx.arc(cx, cy, 20, 0, Math.PI * 2);
  ctx.fillStyle = '#090f18';
  ctx.fill();
  ctx.strokeStyle = 'rgba(201,168,76,0.7)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.font = '15px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(201,168,76,0.9)';
  ctx.fillText('✦', cx, cy);
}

function spinWheel() {
  if (wheelSpinning) return;
  const btn = document.getElementById('spin-btn');
  const res = document.getElementById('wheel-result');
  btn.disabled = true;
  res.style.opacity = '0';
  wheelSpinning = true;

  const segs   = WHEELS[currentWheelDoor];
  const target = Math.floor(Math.random() * segs.length);
  const base   = -(target + 0.5) * (Math.PI / 2);
  const min    = wheelRot + 5 * 2 * Math.PI;
  const n      = Math.ceil((min - base) / (2 * Math.PI));
  const end    = base + n * 2 * Math.PI;

  const startRot = wheelRot;
  const delta    = end - startRot;
  const dur      = 3400 + Math.random() * 900;
  let t0 = null;

  function ease(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(ts) {
    if (!t0) t0 = ts;
    const p = Math.min((ts - t0) / dur, 1);
    wheelRot = startRot + delta * ease(p);
    drawWheel(wheelRot);

    if (p < 1) {
      wheelAF = requestAnimationFrame(frame);
    } else {
      wheelRot = end;
      wheelSpinning = false;
      localStorage.setItem(wheelResultKey(currentWheelDoor), JSON.stringify({ seg: target, rot: end }));
      const winner = WHEELS[currentWheelDoor][target];
      res.textContent = winner.lines.join(' ') + ' 🎉';
      res.style.animation = 'none';
      void res.offsetWidth;
      res.style.animation = '';
      res.style.opacity = '1';
      btn.disabled = true;
      btn.textContent = 'Svaret er låst 🔒';
      btn.style.opacity = '0.4';
      btn.style.cursor = 'default';
    }
  }
  wheelAF = requestAnimationFrame(frame);
}

// ----- Build calendar -----
function buildCalendar() {
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  ADVENT.forEach((_, i) => {
    const alreadyOpen = openedSet.has(i);

    const wrap = document.createElement('div');
    wrap.className = 'door-wrap' + (alreadyOpen ? ' glowing' : '');
    wrap.id = `wrap-${i}`;

    const glow = document.createElement('div');
    glow.className = 'door-glow';

    const door = document.createElement('div');
    door.className = 'door' + (alreadyOpen ? ' opened' : '');
    door.id = `door-${i}`;

    const holly = document.createElement('div');
    holly.className = 'door-holly';
    holly.textContent = '🌿';

    const num = document.createElement('div');
    num.className = 'door-number';
    num.textContent = ROMAN[i];

    const icon = document.createElement('div');
    icon.className = 'door-icon';
    icon.textContent = ICONS[i];

    const lbl = document.createElement('div');
    lbl.className = 'door-label';
    lbl.textContent = LABELS[i];

    door.append(holly, num, icon, lbl);
    door.addEventListener('click', () => isUnlocked(i) ? openDoor(i) : openWaitModal(i));

    wrap.append(glow, door);
    cal.appendChild(wrap);
  });
}

// ----- Wait modal (locked door) -----
function openWaitModal(i) {
  clearInterval(waitCountdownTimer);
  document.querySelector('.modal').style.transformOrigin = '';

  const msg = waitMsgIndex >= WAIT_MSGS.length ? 'Slutt<3' : WAIT_MSGS[waitMsgIndex];
  waitMsgIndex++;

  document.getElementById('modal-icon').textContent  = '🔒';
  document.getElementById('modal-label').textContent = msg;

  const updateTimer = () => {
    const t = countdownText(i);
    document.getElementById('modal-body').innerHTML = t
      ? `<p style="text-align:center;font-size:1.3em;letter-spacing:1px;color:var(--gold-light)">${t}</p>
         <p style="text-align:center;margin-top:12px;opacity:0.5;font-size:0.85em">${LABELS[i]} åpner ${ADVENT[i].toLocaleDateString('no-NO',{weekday:'long',day:'numeric',month:'long'})} kl. 15:00</p>`
      : `<p style="text-align:center">Åpen nå!</p>`;
  };

  updateTimer();
  document.getElementById('overlay').classList.add('show');
  waitCountdownTimer = setInterval(() => {
    if (!document.getElementById('overlay').classList.contains('show')) {
      clearInterval(waitCountdownTimer);
      return;
    }
    if (isUnlocked(i)) {
      clearInterval(waitCountdownTimer);
      closeModal();
      setTimeout(() => openDoor(i), 200);
      return;
    }
    updateTimer();
  }, 1000);
}

// ----- Open a door -----
function openDoor(i) {
  if (animating.has(i)) return;

  const door = document.getElementById(`door-${i}`);
  const wrap = document.getElementById(`wrap-${i}`);

  openedSet.add(i);
  saveOpened();
  animating.add(i);

  wrap.classList.add('glowing');
  // restart animation (remove + reflow + re-add)
  door.classList.remove('opening');
  void door.offsetWidth;
  door.classList.add('opening');

  setTimeout(() => showModal(i), 1400);

  setTimeout(() => {
    door.classList.remove('opening');
    door.classList.add('opened');
    animating.delete(i);
  }, 3400);
}

// ----- Modal -----
function showModal(i) {
  document.getElementById('modal-icon').textContent  = ICONS[i];
  document.getElementById('modal-label').textContent = LABELS[i];

  // On desktop: modal grows out of the door that was clicked
  const modal = document.querySelector('.modal');
  if (window.innerWidth >= 600) {
    const door = document.getElementById(`door-${i}`);
    const dr = door.getBoundingClientRect();
    const offsetX = (dr.left + dr.width / 2) - window.innerWidth / 2;
    const offsetY = (dr.top + dr.height / 2) - window.innerHeight / 2;
    modal.style.transformOrigin = `calc(50% + ${offsetX}px) calc(50% + ${offsetY}px)`;
  } else {
    modal.style.transformOrigin = '';
  }

  document.getElementById('overlay').classList.add('show');

  if (i in WHEELS) {
    renderWheel(i);
  } else {
    document.getElementById('modal-body').innerHTML = CONTENT[i];
  }
}

function closeModal() {
  clearInterval(waitCountdownTimer);
  clearInterval(surpriseTimer);
  if (wheelAF) { cancelAnimationFrame(wheelAF); wheelAF = null; wheelSpinning = false; }
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ----- Stars canvas -----
(function () {
  const canvas = document.getElementById('stars-canvas');
  const ctx    = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = Array.from({ length: 180 }, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.3 + 0.2,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.008 + 0.003,
  }));

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.phase += s.speed;
      const a = (Math.sin(s.phase) * 0.4 + 0.5) * 0.85;
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 248, 220, ${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ----- Snow -----
(function () {
  const layer = document.getElementById('snow-layer');
  const chars = ['❄', '❅', '❆', '·', '•', '*'];

  for (let i = 0; i < 22; i++) {
    const f = document.createElement('span');
    f.className   = 'flake';
    f.textContent = chars[Math.floor(Math.random() * chars.length)];
    f.style.cssText = `
      left:               ${Math.random() * 100}vw;
      font-size:          ${Math.random() * 10 + 7}px;
      opacity:            ${Math.random() * 0.4 + 0.1};
      animation-duration: ${Math.random() * 12 + 10}s;
      animation-delay:    ${-(Math.random() * 20)}s;
    `;
    layer.appendChild(f);
  }
})();

buildCalendar();
